name: Bug report
description: Something in the starter is broken
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened
      description: What you expected vs. what actually happened
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    attributes:
      label: Commit / branch
